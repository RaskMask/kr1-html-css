<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <header class="site-header">
    <nav class="site-nav">
        <ul class="site-nav__list">
            <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
            <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
            <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
            <li class="site-nav__item"><a class="site-nav__link" href="order.html">Заказ</a></li>
            <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
    </nav>
</header>

<main class="site-main">
    <h1 class="catalog-title">Каталог техники Apple</h1>

    <!-- Большая коробка-сетка для товаров -->
    <div class="product-grid">
        
        <!-- Карточка 1: iPhone -->
        <article class="product-card">
            <div class="product-card__badge">Хит</div>
            <img class="product-card__image" src="images/iphonе.png" alt="iPhone 16 Pro">
            <h3 class="product-card__title">iPhone 16 Pro</h3>
            <p class="product-card__price">124 990 ₽</p>
            <a class="product-card__button" href="product.html">Подробнее</a>
        </article>

        <!-- Карточка 2: MacBook -->
        <article class="product-card">
            <img class="product-card__image" src="images/macbook.png" alt="MacBook Air M3">
            <h3 class="product-card__title">MacBook Air M3</h3>
            <p class="product-card__price">139 990 ₽</p>
            <a class="product-card__button" href="product.html">Подробнее</a>
        </article>

        <!-- Карточка 3: Apple Watch -->
        <article class="product-card">
            <div class="product-card__badge product-card__badge--sale">Скидка</div>
            <img class="product-card__image" src="images/watch.png" alt="Apple Watch 10">
            <h3 class="product-card__title">Apple Watch Series 10</h3>
            <p class="product-card__price">44 990 ₽</p>
            <a class="product-card__button" href="product.html">Подробнее</a>
        </article>

    </div>
</main>

<footer class="site-footer">
    <p class="site-footer__text">© 2026 Все права защищены.</p>
</footer>

    
</body>
</html>
