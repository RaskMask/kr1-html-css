<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оформление заказа</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <header class="site-header">
    <nav class="site-nav">
        <ul class="site-nav__list">
            <li class="site-nav__item"><a class="site-nav__link" href="index.html">Главная</a></li>
            <li class="site-nav__item"><a class="site-nav__link" href="catalog.html">Каталог</a></li>
            <li class="site-nav__item"><a class="site-nav__link" href="product.html">Товар</a></li>
            <li class="site-nav__item"><a class="site-nav__link" href="order.html">Заказ</a></li>
            <li class="site-nav__item"><a class="site-nav__link" href="contacts.html">Контакты</a></li>
        </ul>
    </nav>
</header>

<main class="site-main">
    <section class="order-section">
        <h1 class="order-section__title">Оформление заказа</h1>
        <p class="order-section__descr">Заполните форму ниже, чтобы забронировать iPhone 16 Pro.</p>

        <!-- Главный тег ФОРМЫ -->
        <form class="order-form" action="#" method="POST">
            
            <div class="order-form__group">
                <label class="order-form__label" for="user-name">Ваше имя и фамилия:</label>
                <input class="order-form__input" id="user-name" type="text" name="username" placeholder="Иван Иванов" required>
            </div>

            <div class="order-form__group">
                <label class="order-form__label" for="user-phone">Номер телефона:</label>
                <input class="order-form__input" id="user-phone" type="tel" name="userphone" placeholder="+7 (999) 999-99-99" required>
            </div>

            <div class="order-form__group">
                <label class="order-form__label" for="user-email">Электронная почта (Email):</label>
                <input class="order-form__input" id="user-email" type="email" name="useremail" placeholder="example@mail.ru" required>
            </div>

            <div class="order-form__group">
                <label class="order-form__label" for="product-select">Выберите конфигурацию:</label>
                <select class="order-form__select" id="product-select" name="product_config">
                    <option value="16pro-256">iPhone 16 Pro — 256 ГБ (Titanium)</option>
                    <option value="16pro-512">iPhone 16 Pro — 512 ГБ (Titanium)</option>
                    <option value="16promax-256">iPhone 16 Pro Max — 256 ГБ (Black)</option>
                </select>
            </div>

            <!-- Комментарий Большой текст -->
            <div class="order-form__group">
                <label class="order-form__label" for="user-comment">Комментарий к заказу:</label>
                <textarea class="order-form__textarea" id="user-comment" name="usercomment" placeholder="Укажите удобное время для звонка менеджера"></textarea>
            </div>

            <!-- Кнопка отправки формы -->
            <button class="order-form__submit-btn" type="submit">Подтвердить заказ</button>

        </form>
    </section>
</main>

<footer class="site-footer">
    <p class="site-footer__text">© 2026 Все права защищены.</p>
</footer>

    
</body>
</html>
